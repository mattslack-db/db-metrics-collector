[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-metrics"
version = "1.0.0"
description = "Control-plane metrics + configuration collector for cloud databases (Azure and AWS)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
azure = [
    "azure-identity>=1.19,<2",
    "azure-monitor-query>=1.4,<2",
    "azure-mgmt-postgresqlflexibleservers>=1.1,<2",
    "azure-mgmt-mysqlflexibleservers>=1,<2",
    "azure-mgmt-sql>=4,<5",
    "azure-mgmt-cosmosdbforpostgresql>=1,<2",
    "azure-mgmt-rdbms>=10,<11",
]
aws = [
    "boto3>=1.34",
]
report = [
    "matplotlib>=3.8",
]

[project.scripts]
db-metrics-azure = "db_metrics.cli_azure:main"
db-metrics-aws = "db_metrics.cli_aws:main"
db-metrics-recommend = "db_metrics.recommend.cli:main"

[tool.setuptools.packages.find]
include = ["db_metrics*"]
